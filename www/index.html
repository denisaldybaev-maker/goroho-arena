<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Горохо-Арена</title>
<style>
  :root{
    --grass-a:#4c7a3d;
    --grass-b:#5c8f49;
    --sun:#ffc93c;
    --sun-dark:#e0a70f;
    --hud-panel:rgba(17,20,14,0.72);
    --health:#e3432a;
    --cream:#f4f1e5;
    --pea:#2f6b1f;
    --zombie:#7c8a6b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; font-family:'Rajdhani',-apple-system,Segoe UI,Arial,sans-serif;}
  #game{display:block; width:100%; height:100%; touch-action:none;}

  #hud{position:fixed; inset:0; pointer-events:none; color:var(--cream);}
  .top-bar{position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-start; padding:10px 14px; gap:10px;}
  .panel{background:var(--hud-panel); border-radius:10px; padding:8px 12px; pointer-events:auto; backdrop-filter:blur(2px);}
  .health-wrap{display:flex; align-items:center; gap:8px; min-width:140px;}
  .health-bar{width:120px; height:14px; background:#2a2a22; border-radius:7px; overflow:hidden; border:1px solid #000a;}
  .health-fill{height:100%; width:100%; background:var(--health); transition:width .15s;}
  .wave-tag{font-size:15px; letter-spacing:.5px; font-weight:700;}
  .sun-count{display:flex; align-items:center; gap:6px; font-size:20px; font-weight:800; color:var(--sun);}
  .sun-icon{width:18px; height:18px; border-radius:50%; background:var(--sun); box-shadow:0 0 6px var(--sun);}

  #shopBtn{position:absolute; top:56px; left:14px; pointer-events:auto; background:var(--hud-panel); color:var(--sun); border:1px solid #ffc93c55; border-radius:10px; padding:8px 14px; font-weight:800; font-size:14px;}

  .stick-zone{position:absolute; bottom:0; width:50%; height:46%;}
  #leftZone{left:0;}
  #rightZone{right:0;}
  .stick-base{position:absolute; width:96px; height:96px; border-radius:50%; background:#0006; border:2px solid #ffffff33; display:none;}
  .stick-thumb{position:absolute; width:44px; height:44px; border-radius:50%; background:#ffffff44; top:26px; left:26px;}

  #hint{position:absolute; bottom:8px; left:50%; transform:translateX(-50%); font-size:12px; color:#f4f1e5cc; text-align:center; width:90%;}

  #shopOverlay, #gameOverOverlay{position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:#0b0e08cc; pointer-events:auto; z-index:20;}
  .shop-card{background:#1b1f16; border:1px solid #ffc93c44; border-radius:16px; padding:18px; width:min(92vw,420px); max-height:82vh; overflow-y:auto;}
  .shop-title{color:var(--sun); font-size:20px; font-weight:800; margin:0 0 4px;}
  .shop-sub{color:#c9c6b8; font-size:13px; margin:0 0 14px;}
  .weapon{display:flex; align-items:center; gap:12px; background:#262b1e; border:1px solid #ffffff14; border-radius:12px; padding:10px 12px; margin-bottom:10px;}
  .w-icon{width:40px; height:40px; border-radius:10px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:20px;}
  .w-info{flex:1;}
  .w-name{color:var(--cream); font-weight:700; font-size:15px;}
  .w-stats{color:#a9a696; font-size:11.5px; margin-top:2px;}
  .w-btn{border:none; border-radius:8px; padding:8px 12px; font-weight:800; font-size:13px; flex:0 0 auto;}
  .buy{background:var(--sun); color:#241d00;}
  .equip{background:#3a4a2e; color:var(--cream);}
  .equipped{background:#5c8f49; color:#fff;}
  .close-shop{width:100%; margin-top:6px; padding:10px; border:none; border-radius:10px; background:#3a3f31; color:var(--cream); font-weight:700;}

  #gameOverOverlay .shop-card{text-align:center;}
  #restartBtn{margin-top:14px; padding:12px 22px; border:none; border-radius:10px; background:var(--sun); color:#241d00; font-weight:800; font-size:16px;}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="top-bar">
    <div class="panel health-wrap">
      <div class="health-bar"><div class="health-fill" id="healthFill"></div></div>
    </div>
    <div class="panel wave-tag" id="waveTag">Волна 1</div>
    <div class="panel sun-count"><div class="sun-icon"></div><span id="sunCount">0</span></div>
  </div>
  <button id="shopBtn">🛒 МАГАЗИН</button>
  <div id="hint">Слева — движение. Справа — прицел (держи, чтобы стрелять). Без прицела — авто-огонь по ближайшему врагу.</div>
</div>

<div class="stick-zone" id="leftZone"><div class="stick-base" id="leftBase"><div class="stick-thumb" id="leftThumb"></div></div></div>
<div class="stick-zone" id="rightZone"><div class="stick-base" id="rightBase"><div class="stick-thumb" id="rightThumb"></div></div></div>

<div id="shopOverlay">
  <div class="shop-card">
    <p class="shop-title">Магазин оружия</p>
    <p class="shop-sub">Собирай солнышки с убитых врагов и покупай новое оружие</p>
    <div id="weaponList"></div>
    <button class="close-shop" id="closeShop">Закрыть</button>
  </div>
</div>

<div id="gameOverOverlay">
  <div class="shop-card">
    <p class="shop-title">Вы погибли</p>
    <p class="shop-sub" id="finalStats"></p>
    <button id="restartBtn">Начать заново</button>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;
  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W*DPR; canvas.height = H*DPR;
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  const WORLD = {w: 2200, h: 2200};

  const WEAPONS = [
    {id:'pea', name:'Горохострел', cost:0, dmg:9, rate:340, range:340, speed:520, spread:0, pellets:1, color:'#4caf3f', icon:'🌱'},
    {id:'repeat', name:'Повторитель', cost:60, dmg:8, rate:220, range:360, speed:560, spread:2, pellets:2, color:'#3f8f4c', icon:'🌿'},
    {id:'gatling', name:'Гатлинг-горох', cost:160, dmg:6, rate:100, range:320, speed:600, spread:5, pellets:1, color:'#d97b3c', icon:'🔥'},
    {id:'snow', name:'Ледяной горох', cost:110, dmg:7, rate:300, range:340, speed:500, spread:0, pellets:1, color:'#79c7e0', icon:'❄️', slow:true},
    {id:'melon', name:'Дынемёт', cost:240, dmg:26, rate:650, range:380, speed:420, spread:0, pellets:1, color:'#c94f6a', icon:'🍉', splash:60},
  ];

  let state;
  function freshState(){
    return {
      player:{x:WORLD.w/2, y:WORLD.h/2, r:20, hp:100, maxHp:100, speed:210, dir:0},
      sun:0,
      wave:1,
      waveTimer:0,
      spawnCooldown:0,
      enemies:[],
      bullets:[],
      coins:[],
      owned:{pea:true},
      currentWeaponId:'pea',
      fireCooldown:0,
      running:true,
      paused:false,
      time:0,
    };
  }
  state = freshState();

  function currentWeapon(){ return WEAPONS.find(w=>w.id===state.currentWeaponId); }

  // ---------- input: dual virtual joysticks ----------
  function makeStick(zoneEl, baseEl, thumbEl){
    const s = {active:false, dx:0, dy:0, id:null};
    function show(x,y){
      baseEl.style.display='block';
      baseEl.style.left=(x-48)+'px';
      baseEl.style.top=(y-48)+'px';
      thumbEl.style.left='26px'; thumbEl.style.top='26px';
    }
    function move(x,y){
      const rect = baseEl.getBoundingClientRect();
      const cx = rect.left+48, cy=rect.top+48;
      let dx = x-cx, dy = y-cy;
      const max = 48;
      const dist = Math.hypot(dx,dy);
      if(dist>max){ dx=dx/dist*max; dy=dy/dist*max; }
      thumbEl.style.left=(26+dx)+'px'; thumbEl.style.top=(26+dy)+'px';
      s.dx = dx/max; s.dy = dy/max;
    }
    function end(){ s.active=false; s.id=null; s.dx=0; s.dy=0; baseEl.style.display='none'; }
    zoneEl.addEventListener('touchstart', e=>{
      if(s.active) return;
      const t = e.changedTouches[0];
      s.active=true; s.id=t.identifier;
      show(t.clientX, t.clientY);
      move(t.clientX, t.clientY);
      e.preventDefault();
    }, {passive:false});
    zoneEl.addEventListener('touchmove', e=>{
      for(const t of e.changedTouches){
        if(t.identifier===s.id){ move(t.clientX,t.clientY); e.preventDefault(); }
      }
    }, {passive:false});
    zoneEl.addEventListener('touchend', e=>{
      for(const t of e.changedTouches){ if(t.identifier===s.id) end(); }
    });
    zoneEl.addEventListener('touchcancel', ()=>end());
    return s;
  }
  const moveStick = makeStick(document.getElementById('leftZone'), document.getElementById('leftBase'), document.getElementById('leftThumb'));
  const aimStick = makeStick(document.getElementById('rightZone'), document.getElementById('rightBase'), document.getElementById('rightThumb'));

  // keyboard fallback (desktop testing)
  const keys = {};
  window.addEventListener('keydown', e=>keys[e.key.toLowerCase()]=true);
  window.addEventListener('keyup', e=>keys[e.key.toLowerCase()]=false);

  // ---------- shop ----------
  const shopOverlay = document.getElementById('shopOverlay');
  const weaponList = document.getElementById('weaponList');
  document.getElementById('shopBtn').addEventListener('click', ()=>{ state.paused=true; renderShop(); shopOverlay.style.display='flex'; });
  document.getElementById('closeShop').addEventListener('click', ()=>{ shopOverlay.style.display='none'; state.paused=false; });

  function renderShop(){
    weaponList.innerHTML='';
    WEAPONS.forEach(w=>{
      const owned = !!state.owned[w.id];
      const equipped = state.currentWeaponId===w.id;
      const row = document.createElement('div');
      row.className='weapon';
      row.innerHTML = `
        <div class="w-icon" style="background:${w.color}33;">${w.icon}</div>
        <div class="w-info">
          <div class="w-name">${w.name}</div>
          <div class="w-stats">Урон ${w.dmg} · Скорострельность ${(1000/w.rate).toFixed(1)}/с · Дальность ${w.range}</div>
        </div>
        <button class="w-btn ${owned ? (equipped?'equipped':'equip') : 'buy'}">${owned ? (equipped?'Экипировано':'Выбрать') : ('☀ '+w.cost)}</button>
      `;
      const btn = row.querySelector('button');
      btn.addEventListener('click', ()=>{
        if(!owned){
          if(state.sun>=w.cost){ state.sun-=w.cost; state.owned[w.id]=true; state.currentWeaponId=w.id; renderShop(); }
        } else if(!equipped){
          state.currentWeaponId = w.id; renderShop();
        }
      });
      weaponList.appendChild(row);
    });
  }

  // ---------- game over ----------
  const gameOverOverlay = document.getElementById('gameOverOverlay');
  document.getElementById('restartBtn').addEventListener('click', ()=>{
    state = freshState();
    gameOverOverlay.style.display='none';
  });

  // ---------- entities ----------
  function spawnEnemy(){
    const angle = Math.random()*Math.PI*2;
    const dist = 620;
    const x = state.player.x + Math.cos(angle)*dist;
    const y = state.player.y + Math.sin(angle)*dist;
    const hp = 26 + state.wave*7;
    state.enemies.push({x,y, r:18, hp, maxHp:hp, speed: 48+Math.min(state.wave*2.4, 60), slowT:0, hitFlash:0});
  }

  function dist2(ax,ay,bx,by){ const dx=ax-bx, dy=ay-by; return dx*dx+dy*dy; }

  function fireBullet(dirx, diry){
    const w = currentWeapon();
    const spread = (w.spread||0) * Math.PI/180;
    for(let i=0;i<(w.pellets||1);i++){
      const off = w.pellets>1 ? (i-(w.pellets-1)/2)*0.12 : (Math.random()-0.5)*spread;
      const a = Math.atan2(diry,dirx) + off;
      state.bullets.push({
        x: state.player.x, y: state.player.y,
        vx: Math.cos(a)*w.speed, vy: Math.sin(a)*w.speed,
        dmg: w.dmg, range: w.range, traveled:0,
        slow: !!w.slow, splash: w.splash||0, color: w.color
      });
    }
  }

  // ---------- main loop ----------
  let last = performance.now();
  function loop(now){
    const dt = Math.min((now-last)/1000, 0.05);
    last = now;
    if(state.running && !state.paused) update(dt);
    render();
    requestAnimationFrame(loop);
  }

  function update(dt){
    state.time += dt;
    const p = state.player;

    // movement
    let mx = moveStick.dx, my = moveStick.dy;
    if(keys['w']) my-=1; if(keys['s']) my+=1; if(keys['a']) mx-=1; if(keys['d']) mx+=1;
    const mlen = Math.hypot(mx,my);
    if(mlen>0.05){
      mx/=Math.max(mlen,1); my/=Math.max(mlen,1);
      p.x += mx*p.speed*dt; p.y += my*p.speed*dt;
      p.dir = Math.atan2(my,mx);
    }
    p.x = Math.max(30, Math.min(WORLD.w-30, p.x));
    p.y = Math.max(30, Math.min(WORLD.h-30, p.y));

    // aiming / firing
    const w = currentWeapon();
    let aimx=0, aimy=0, manualAim=false;
    if(Math.hypot(aimStick.dx,aimStick.dy) > 0.15){
      aimx = aimStick.dx; aimy = aimStick.dy; manualAim = true;
      p.dir = Math.atan2(aimy,aimx);
    } else {
      // auto target nearest enemy in range
      let best=null, bd=w.range*w.range;
      for(const e of state.enemies){
        const d = dist2(p.x,p.y,e.x,e.y);
        if(d<bd){ bd=d; best=e; }
      }
      if(best){ aimx = best.x-p.x; aimy = best.y-p.y; const l=Math.hypot(aimx,aimy); aimx/=l; aimy/=l; manualAim=true; p.dir=Math.atan2(aimy,aimx); }
    }
    state.fireCooldown -= dt*1000;
    if(manualAim && state.fireCooldown<=0){
      fireBullet(aimx,aimy);
      state.fireCooldown = w.rate;
    }

    // spawn waves
    state.waveTimer += dt;
    if(state.waveTimer > 18){ state.waveTimer=0; state.wave++; }
    state.spawnCooldown -= dt;
    const spawnEvery = Math.max(0.5, 1.6 - state.wave*0.05);
    if(state.spawnCooldown<=0 && state.enemies.length < 14+state.wave){
      spawnEnemy(); state.spawnCooldown = spawnEvery;
    }

    // enemies move towards player
    for(const e of state.enemies){
      const dx=p.x-e.x, dy=p.y-e.y, d=Math.hypot(dx,dy)||1;
      const sp = e.slowT>0 ? e.speed*0.4 : e.speed;
      e.x += dx/d*sp*dt; e.y += dy/d*sp*dt;
      if(e.slowT>0) e.slowT -= dt;
      if(e.hitFlash>0) e.hitFlash -= dt;
      if(d < e.r+p.r+4){
        p.hp -= 16*dt;
      }
    }
    if(p.hp<=0 && state.running){
      state.running=false;
      document.getElementById('finalStats').textContent = `Волна ${state.wave} · Собрано солнышек: ${state.sun}`;
      gameOverOverlay.style.display='flex';
    }

    // bullets
    for(const b of state.bullets){
      b.x += b.vx*dt; b.y += b.vy*dt;
      b.traveled += Math.hypot(b.vx,b.vy)*dt;
    }
    state.bullets = state.bullets.filter(b=>{
      if(b.traveled>b.range) return false;
      for(const e of state.enemies){
        if(dist2(b.x,b.y,e.x,e.y) < (e.r+6)*(e.r+6)){
          e.hp -= b.dmg; e.hitFlash=0.1;
          if(b.slow) e.slowT = 1.4;
          if(b.splash){
            for(const e2 of state.enemies){ if(e2!==e && dist2(e2.x,e2.y,e.x,e.y)<b.splash*b.splash) { e2.hp -= b.dmg*0.5; e2.hitFlash=0.1; } }
          }
          return false;
        }
      }
      return true;
    });

    // enemy deaths -> coins
    const alive=[];
    for(const e of state.enemies){
      if(e.hp<=0){
        state.coins.push({x:e.x, y:e.y, r:9, value: 4+Math.floor(state.wave*0.6)});
      } else alive.push(e);
    }
    state.enemies = alive;

    // coins magnet + collect
    for(const c of state.coins){
      const d = Math.hypot(c.x-p.x, c.y-p.y);
      if(d < 110){ c.x += (p.x-c.x)*Math.min(1,dt*6); c.y += (p.y-c.y)*Math.min(1,dt*6); }
    }
    state.coins = state.coins.filter(c=>{
      if(Math.hypot(c.x-p.x,c.y-p.y) < p.r+8){ state.sun += c.value; return false; }
      return true;
    });

    document.getElementById('sunCount').textContent = state.sun;
    document.getElementById('waveTag').textContent = 'Волна '+state.wave;
    document.getElementById('healthFill').style.width = Math.max(0,p.hp)+'%';
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    const p = state.player;
    const camX = p.x - W/2, camY = p.y - H/2;

    // grass field
    const tile=64;
    const startX = Math.floor(camX/tile)-1, startY=Math.floor(camY/tile)-1;
    const endX = Math.ceil((camX+W)/tile)+1, endY=Math.ceil((camY+H)/tile)+1;
    for(let ty=startY; ty<endY; ty++){
      for(let tx=startX; tx<endX; tx++){
        ctx.fillStyle = ((tx+ty)%2===0) ? getCss('--grass-a') : getCss('--grass-b');
        ctx.fillRect(tx*tile-camX, ty*tile-camY, tile+1, tile+1);
      }
    }
    // world border
    ctx.strokeStyle='#1c2a14'; ctx.lineWidth=10;
    ctx.strokeRect(-camX, -camY, WORLD.w, WORLD.h);

    // coins
    for(const c of state.coins){
      drawSun(c.x-camX, c.y-camY, c.r);
    }

    // bullets
    for(const b of state.bullets){
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.arc(b.x-camX, b.y-camY, 6, 0, Math.PI*2); ctx.fill();
    }

    // enemies
    for(const e of state.enemies){
      const x=e.x-camX, y=e.y-camY;
      ctx.fillStyle = e.hitFlash>0 ? '#ffffff' : getCss('--zombie');
      ctx.beginPath(); ctx.arc(x,y,e.r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#3a3f2e';
      ctx.fillRect(x-10,y-e.r-10,20,4);
      ctx.fillStyle='#8fae3a';
      ctx.fillRect(x-10,y-e.r-10,20*Math.max(0,e.hp/e.maxHp),4);
    }

    // player
    ctx.save();
    ctx.translate(p.x-camX, p.y-camY);
    ctx.rotate(p.dir);
    ctx.fillStyle = getCss('--pea');
    ctx.beginPath(); ctx.arc(0,0,p.r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#3f8f4c';
    ctx.fillRect(p.r-4,-6,20,12);
    ctx.restore();

    ctx.fillStyle='#eaffb0';
    ctx.beginPath(); ctx.arc(p.x-camX,p.y-camY,3,0,Math.PI*2); ctx.fill();
  }

  function drawSun(x,y,r){
    ctx.fillStyle=getCss('--sun');
    for(let i=0;i<8;i++){
      const a = i/8*Math.PI*2;
      ctx.save(); ctx.translate(x,y); ctx.rotate(a);
      ctx.fillRect(-1.5, -r-4, 3, 4);
      ctx.restore();
    }
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }

  function getCss(varName){
    return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
